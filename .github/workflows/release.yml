name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Apple Silicon bundle
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      NATIVE_TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: rustup target add aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm run build:native-engine
      - run: npx tauri build --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v6
        with:
          name: 9-gyo-phi-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          --draft --generate-notes --title "9-gyo-φ ${GITHUB_REF_NAME}"
