[package]
name = "nine-gyo-phi"
version = "0.2.0"
description = "A private listening library for PDFs, notes, and ideas"
authors = ["9-gyo-phi contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "nine_gyo_phi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc.13", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0-rc.17", features = [] }
tauri-plugin-log = "2.0.0-rc"
base64 = "0.22"
