[package]
name = "nine-gyo-phi"
version = "0.4.0"
description = "A private, local-first document reader and audiobook studio"
authors = ["9-gyo-phi contributors"]
license = "MIT"
repository = "https://github.com/anpu-ai-official/9-gyo-phi"
homepage = "https://github.com/anpu-ai-official/9-gyo-phi"
edition = "2021"

[lib]
name = "nine_gyo_phi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-log = "2.9"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate", "json"] }
url = "2.5"
sha2 = "0.11"
kokoro-en = { git = "https://github.com/anpu-ai-official/kokoro.git", rev = "d92109f892b59e42b1e2697c98a8bc9e7aa90c78", default-features = false, features = ["misaki-lean"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
oxideav-aac = "0.1.7"
oxideav-core = "0.1"
oxideav-mp4 = "0.0.10"
